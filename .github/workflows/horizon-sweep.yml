name: Sweep Horizon Prediksi BTC

on:
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Hitung indikator teknikal
        run: python compute_indicators.py

      - name: Sweep berbagai horizon prediksi
        run: python horizon_sweep.py
